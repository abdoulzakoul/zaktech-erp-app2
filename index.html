<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZAKTECH ERP</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2563EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZAKTECH">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--blue:#2563EB;--blue-dark:#1D4ED8;--gray:#F1F3F7;--gray-mid:#E4E8F0;--ink:#0F172A;--ink-soft:#5B6478;--danger:#DC2626;--ok:#16A34A;--warn:#D97706;--radius:14px;--shadow:0 8px 24px -8px rgba(15,23,42,.12);}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;background:var(--gray);color:var(--ink);}
h1,h2,h3,.brand{font-family:'Sora',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
.app{display:flex;min-height:100vh}
.sidebar{width:235px;background:var(--ink);color:#fff;display:flex;flex-direction:column;flex-shrink:0;}
.sidebar .brand{padding:20px;font-size:17px;font-weight:800;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;word-break:break-word}
.brand img{width:28px;height:28px;object-fit:contain;border-radius:6px;background:#fff;padding:2px;flex-shrink:0}
.brand .dot{width:10px;height:10px;border-radius:3px;background:var(--blue);flex-shrink:0}
.nav{padding:10px;overflow-y:auto;flex:1}
.nav button{width:100%;text-align:left;background:none;border:0;color:#C7CDDB;padding:9px 12px;border-radius:9px;font-size:13px;cursor:pointer;margin-bottom:1px;display:flex;align-items:center;gap:9px;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.active{background:var(--blue);color:#fff}
.nav .nav-sep{padding:8px 12px 4px;font-size:10px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.6px}
.main{flex:1;padding:26px 32px;overflow-y:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.topbar h1{font-size:22px;margin:0}
.pill{background:#fff;padding:6px 12px;border-radius:20px;font-size:12px;color:var(--ink-soft);box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:20px}
.card{background:#fff;border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.kpi .label{font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .value{font-size:24px;font-weight:800;margin-top:6px;font-family:'Sora',sans-serif}
.kpi .value.blue{color:var(--blue)}.kpi .value.ok{color:var(--ok)}.kpi .value.danger{color:var(--danger)}
.charts{grid-template-columns:1fr 1fr}
.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.panel-title h2{font-size:16px;margin:0}
button.btn{background:var(--blue);color:#fff;border:0;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
button.btn:hover{background:var(--blue-dark)}
button.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--gray-mid)}
button.btn.danger{background:var(--danger)}button.btn.ok{background:var(--ok)}
button.btn.sm{padding:5px 10px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px;padding:8px 10px;border-bottom:1px solid var(--gray-mid)}
td{padding:8px 10px;border-bottom:1px solid #F0F1F5}
tr:hover td{background:#FAFBFD}
input,select,textarea{border:1px solid var(--gray-mid);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;width:100%;background:#fff;color:var(--ink)}
label{font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:4px}
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.toolbar input[type=text],.toolbar input[type=search]{width:200px}
.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}
.badge.ok{background:#DCFCE7;color:#166534}.badge.warn{background:#FEF3C7;color:#92400E}.badge.danger{background:#FEE2E2;color:#991B1B}.badge.info{background:#DBEAFE;color:#1E40AF}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:540px;max-width:94vw;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin-top:0}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translateY(0)}
.empty{padding:40px;text-align:center;color:var(--ink-soft);font-size:13px}
.section-hint{color:var(--ink-soft);font-size:12.5px;margin-bottom:16px}
input.invalid,select.invalid,textarea.invalid{border-color:var(--danger)!important;box-shadow:0 0 0 3px rgba(220,38,38,.15)}
.acc-group{border:1px solid var(--gray-mid);border-radius:10px;margin-bottom:10px;overflow:hidden}
.acc-header{width:100%;display:flex;justify-content:space-between;align-items:center;background:#fafbfd;border:0;padding:12px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);font-family:inherit}
.acc-header:hover{background:#f2f4f8}
.acc-count{color:var(--ink-soft);font-weight:500;font-size:12px}
.acc-chevron{transition:transform .2s;color:var(--ink-soft);font-size:12px}
.acc-header.open .acc-chevron{transform:rotate(180deg)}
.acc-body{display:none;padding:10px 14px 14px;border-top:1px solid var(--gray-mid)}
.acc-body.open{display:block}

/* ===== MODE DÉMO (masquer les données sensibles pour captures/vidéos) ===== */
body.privacy-mode table td:not(:last-child),
body.privacy-mode .kpi .value,
body.privacy-mode .kpi .label{
  filter:blur(6px);
  user-select:none;
  transition:filter .2s ease;
}
#privacyToggle.active{background:var(--danger);color:#fff;border-color:var(--danger)}
.hamburger{display:none;background:none;border:0;font-size:22px;line-height:1;color:var(--ink);cursor:pointer;padding:6px 8px;margin-right:8px;border-radius:8px}
.hamburger:active{background:var(--gray-mid)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:59}
.sidebar-overlay.open{display:block}
.card{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ===== RESPONSIVE MOBILE ===== */
@media (max-width:860px){
  .hamburger{display:inline-flex;align-items:center}
  .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:60;transform:translateX(-100%);transition:transform .25s ease;width:250px;max-width:82vw;box-shadow:0 0 30px rgba(0,0,0,.3)}
  .sidebar.open{transform:translateX(0)}
  .main{padding:14px}
  .topbar{margin-bottom:16px;flex-wrap:wrap;gap:8px}
  .topbar h1{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .charts{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .toolbar{gap:8px}
  .toolbar input[type=text],.toolbar input[type=search]{width:100%;flex:1 1 100%}
  button.btn{padding:10px 14px}
  table{font-size:12.5px}
  th,td{padding:7px 8px;white-space:nowrap}
  .modal{padding:18px}
  .formrow{grid-template-columns:1fr}
  .card{padding:14px 16px}
}
@media (max-width:420px){
  .kpis{grid-template-columns:1fr}
  .topbar h1{font-size:15px}
  .pill{font-size:10.5px;padding:5px 9px}
}
</style>
</head>
<body>
<div id="licenseGate" style="display:none;min-height:100vh;align-items:center;justify-content:center;background:#F1F3F7;padding:20px">
  <div class="card" style="max-width:380px;width:100%;text-align:center;padding:34px 28px">
    <div style="font-size:38px;margin-bottom:10px">🔑</div>
    <h2 style="margin:0 0 6px;font-family:'Sora',sans-serif;color:var(--ink)">ZAKTECH ERP</h2>
    <div class="section-hint" style="margin-bottom:20px">Entrez votre code d'activation pour continuer.</div>
    <input id="licenseInput" placeholder="Ex: ZAK-0001" style="text-align:center;font-size:16px;letter-spacing:2px;margin-bottom:12px;text-transform:uppercase;width:100%">
    <button class="btn" id="licenseBtn" style="width:100%">Activer</button>
  </div>
</div>
<div class="app" id="appRoot" style="display:none">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="sidebar" id="sidebar">
    <div class="brand" id="brandBox"><span class="dot"></span>ZAKTECH ERP</div>
    <div class="nav" id="nav"></div>
  </div>
  <div class="main">
    <div class="topbar"><div style="display:flex;align-items:center;min-width:0"><button class="hamburger" id="hamburgerBtn" aria-label="Menu">☰</button><h1 id="pageTitle">Tableau de bord</h1></div><div style="display:flex;align-items:center;gap:8px"><button class="btn ghost sm" id="privacyToggle" type="button" title="Masquer/afficher les montants et données sensibles" style="font-size:16px;padding:8px 11px">👁️</button><div class="pill" id="clock"></div></div></div>
    <div id="content"></div>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== LICENCE ===== */
/* Liste des codes d'activation valides — ajoutez une ligne "'CODE': 'Nom du client'" par nouveau client.
   Pour révoquer un client (code partagé/revendu), supprimez sa ligne et renvoyez ce fichier sur GitHub. */
const LICENSE_CODES = {
  'ZAK-0001': 'Client Démo',
  'ZAK-0002': '',
  'ZAK-0003': ''
};

/* ===== UTILITAIRES ===== */
const DB_KEY = 'zaktech_erp_v3';
const uid = () => Math.random().toString(36).slice(2,9).toUpperCase();
const todayISO = () => new Date().toISOString().slice(0,10);
const fmt = n => Math.round(Number(n)||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ') + ' FCFA';
function inPeriod(dateStr,period,customMonth){
  if(period==='')return false;
  if(period==='all')return true;
  if(!dateStr)return false;
  const d=new Date(dateStr);
  if(isNaN(d))return false;
  const now=new Date();
  if(period==='today')return d.toDateString()===now.toDateString();
  if(period==='week'){const start=new Date(now);start.setDate(now.getDate()-now.getDay());start.setHours(0,0,0,0);return d>=start;}
  if(period==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
  if(period==='custom-month'){
    if(!customMonth)return false;
    const parts=customMonth.split('-').map(Number);
    return d.getFullYear()===parts[0]&&(d.getMonth()+1)===parts[1];
  }
  return true;
}
const MONTH_NAMES=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function monthLabel(ym){
  if(!ym)return '';
  const parts=ym.split('-').map(Number);
  return `${MONTH_NAMES[parts[1]-1]} ${parts[0]}`;
}
function periodFilterHTML(id,def=''){
  const opts=[['','— Choisir une période —'],['today',"Aujourd'hui"],['week','Cette semaine'],['month','Mois en cours'],['custom-month','Un mois précis…'],['all','Toutes les dates']];
  return `<span style="display:inline-flex;gap:6px;align-items:center">
    <select id="${id}" style="max-width:190px">
      ${opts.map(([v,l])=>`<option value="${v}"${v===def?' selected':''}>${l}</option>`).join('')}
    </select>
    <input type="month" id="${id}_month" style="display:${def==='custom-month'?'inline-block':'none'};max-width:150px">
  </span>`;
}
function wirePeriodFilter(id,onChange){
  const sel=document.getElementById(id);
  const monthInput=document.getElementById(id+'_month');
  sel.onchange=()=>{
    const isCustom=sel.value==='custom-month';
    monthInput.style.display=isCustom?'inline-block':'none';
    if(isCustom&&!monthInput.value){
      const now=new Date();
      monthInput.value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    }
    onChange();
  };
  monthInput.onchange=onChange;
}
function currentPeriod(id){
  const sel=document.getElementById(id);
  const monthInput=document.getElementById(id+'_month');
  return {period:sel?sel.value:'', customMonth:monthInput?monthInput.value:''};
}
function periodEmptyMsg(period){
  return period===''
    ? '<div class="empty">Choisissez une période ci-dessus pour afficher l\'historique.</div>'
    : '<div class="empty">Aucun résultat pour ce filtre.</div>';
}
function toast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.style.background=type==='ok'?'#16A34A':type==='warn'?'#D97706':'#0F172A';t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600);}
function openModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modalBg').classList.add('open');}
function closeModal(){document.getElementById('modalBg').classList.remove('open');}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});

/* ===== COULEURS DE L'APPLICATION ===== */
function darkenColor(hex,percent){
  hex=(hex||'#2563EB').replace('#','');
  if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  const num=parseInt(hex,16)||0;
  let r=(num>>16)&255,g=(num>>8)&255,b=num&255;
  r=Math.max(0,Math.round(r*(1-percent)));g=Math.max(0,Math.round(g*(1-percent)));b=Math.max(0,Math.round(b*(1-percent)));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function applyColors(){
  const c=(DATA.settings&&DATA.settings.colors)||{};
  const root=document.documentElement;
  const primary=c.primary||'#2563EB';
  root.style.setProperty('--blue',primary);
  root.style.setProperty('--blue-dark',darkenColor(primary,0.15));
  root.style.setProperty('--ok',c.ok||'#16A34A');
  root.style.setProperty('--danger',c.danger||'#DC2626');
  root.style.setProperty('--warn',c.warn||'#D97706');
}

/* ===== DONNÉES ===== */
function defaultData(){
  return {
    settings:{nom:'ZAKTECH',adresse:'Niamey, Niger',tel:'',whatsapp:'',email:'',site:'',devise:'FCFA',tva:0,dark:false,logo:'',secCode:'',colors:{primary:'#2563EB',ok:'#16A34A',danger:'#DC2626',warn:'#D97706'}},
    clients:[],formations:[],inscriptions:[],paiements:[],caisse:[],
    impressions:[],graphisme:[],maintenance:[],stock:[],fournisseurs:[],employes:[],
    factures:[],services:[],ventes:[],
    modulesPerso:[],
    customData:{},
    hiddenModules:[],
    moduleLabels:{},
    impressionServices:[
      {id:'is1',nom:'Impression N&B'},
      {id:'is2',nom:'Impression Couleur'},
      {id:'is3',nom:'Photocopie N&B'},
      {id:'is4',nom:'Photocopie Couleur'},
      {id:'is5',nom:'Scan'},
      {id:'is6',nom:'Reliure'},
      {id:'is7',nom:'Plastification'},
      {id:'is8',nom:'Photo Minute'}
    ]
  };
}
let DATA;
try{DATA=JSON.parse(localStorage.getItem(DB_KEY)||'null')||defaultData();}
catch(e){DATA=defaultData();}
// Migration
(function(){const def=defaultData();Object.keys(def).forEach(k=>{if(DATA[k]===undefined)DATA[k]=def[k];});if(DATA.settings)Object.keys(def.settings).forEach(k=>{if(DATA.settings[k]===undefined)DATA.settings[k]=def.settings[k];});})();

let STORAGE_OK = true;
function save(){
  try{localStorage.setItem(DB_KEY,JSON.stringify(DATA));}
  catch(e){if(STORAGE_OK){STORAGE_OK=false;toast('⚠️ Sauvegarde impossible (stockage bloqué)','warn');}}
}

/* ===== CAISSE HELPER ===== */
function addCaisse(type, libelle, montant, date=null){
  DATA.caisse.push({id:uid(),type,libelle,montant:Number(montant)||0,date:date||todayISO()});
}

/* ===== NAVIGATION ===== */
const MODULES_FIXES = [
  {id:'dashboard',label:'Tableau de bord',icon:'📊',group:'main'},
  {id:'clients',label:'Clients',icon:'👤',group:'main'},
  {id:'formations',label:'Formations',icon:'🎓',group:'main'},
  {id:'inscriptions',label:'Inscriptions',icon:'📝',group:'main'},
  {id:'paiements',label:'Paiements',icon:'💳',group:'main'},
  {id:'caisse',label:'Caisse',icon:'🗄️',group:'main'},
  {id:'ventes',label:'Ventes',icon:'🛒',group:'ops'},
  {id:'impressions',label:'Impressions & Photocopies',icon:'🖨️',group:'ops'},
  {id:'graphisme',label:'Graphisme',icon:'🎨',group:'ops'},
  {id:'maintenance',label:'Maintenance',icon:'🛠️',group:'ops'},
  {id:'stock',label:'Stock',icon:'📦',group:'stock'},
  {id:'fournisseurs',label:'Fournisseurs',icon:'🚚',group:'stock'},
  {id:'employes',label:'Employés',icon:'🧑‍💼',group:'rh'},
  {id:'factures',label:'Facturation',icon:'🧾',group:'fin'},
  {id:'services',label:'Services',icon:'🧩',group:'fin'},
  {id:'rapports',label:'Rapports',icon:'📈',group:'fin'},
  {id:'parametres',label:'Paramètres',icon:'⚙️',group:'fin'},
];
let current='dashboard';
let paramUnlocked=false;
let privacyMode=localStorage.getItem('zaktech_privacy')==='1';

const GROUP_RANK={main:0,ops:1,stock:2,rh:3,fin:4};
function renderNav(){
  const nav=document.getElementById('nav');
  const groupLabels={main:'',ops:'Opérations',stock:'Stock & Achats',rh:'Ressources Humaines',fin:'Finance & Admin'};
  let html='';let lastGroup='';
  const items=MODULES_FIXES
    .filter(m=>!DATA.hiddenModules.includes(m.id))
    .map(m=>{
      const ov=DATA.moduleLabels[m.id];
      return ov?{...m,label:ov.label||m.label,icon:ov.icon||m.icon}:{...m};
    });
  // Insérer les services dynamiques après dashboard
  const dashI=items.findIndex(m=>m.id==='dashboard');
  DATA.services.forEach((s,i)=>items.splice(dashI+1+i,0,{id:'svc_'+s.id,label:s.nom,icon:'🔹',group:'svc',dynamic:true}));
  // Insérer chaque module personnalisé en haut de la section qu'il a choisie
  ['ops','stock','rh','fin'].forEach(grp=>{
    const mods=DATA.modulesPerso.filter(m=>(m.group||'fin')===grp);
    if(!mods.length)return;
    const rank=GROUP_RANK[grp];
    let insertAt=items.findIndex(x=>(GROUP_RANK[x.group]!==undefined?GROUP_RANK[x.group]:-1)>=rank);
    if(insertAt===-1)insertAt=items.length;
    mods.slice().reverse().forEach(m=>{
      items.splice(insertAt,0,{id:'mod_'+m.id,label:m.label,icon:m.icon||'📁',group:grp});
    });
  });
  items.forEach(m=>{
    if(m.group!==lastGroup&&m.group!=='svc'){html+=`<div class="nav-sep">${groupLabels[m.group]||''}</div>`;lastGroup=m.group;}
    html+=`<button data-id="${m.id}" class="${m.id===current?'active':''}" style="${m.dynamic?'padding-left:28px;font-size:12px':''}"><span>${m.icon}</span>${m.label}</button>`;
  });
  nav.innerHTML=html;
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    current=b.dataset.id;render();
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
  });
}
function updateBrand(){
  const s=DATA.settings;
  document.getElementById('brandBox').innerHTML=s.logo
    ?`<img src="${s.logo}">${s.nom}`
    :`<span class="dot"></span>${s.nom}`;
}
function render(){
  renderNav();updateBrand();
  const fixed=MODULES_FIXES.find(m=>m.id===current);
  const fixedLabel=fixed?((DATA.moduleLabels[fixed.id]&&DATA.moduleLabels[fixed.id].label)||fixed.label):null;
  const dynSvc=current.startsWith('svc_')?DATA.services.find(s=>'svc_'+s.id===current):null;
  const dynMod=current.startsWith('mod_')?DATA.modulesPerso.find(m=>'mod_'+m.id===current):null;
  document.getElementById('pageTitle').textContent=fixed?fixedLabel:(dynSvc?dynSvc.nom:(dynMod?dynMod.label:''));
  if(dynSvc){renderServicePage(dynSvc);return;}
  if(dynMod){renderCustomModule(dynMod);return;}
  if(current==='parametres'&&DATA.settings.secCode&&!paramUnlocked){renderParamLock();return;}
  ({dashboard:renderDashboard,clients:()=>renderCrud('clients'),formations:()=>renderCrud('formations'),
    inscriptions:renderInscriptions,paiements:renderPaiements,caisse:renderCaisse,
    ventes:renderVentes,impressions:renderImpressions,graphisme:()=>renderCrud('graphisme'),
    maintenance:()=>renderCrud('maintenance'),stock:()=>renderCrud('stock'),
    fournisseurs:()=>renderCrud('fournisseurs'),employes:()=>renderCrud('employes'),

/* ===== CRUD GÉNÉRIQUE ===== */
function fieldInput(f,val=''){
  if(f.t==='select')return`<select id="f_${f.k}">${f.opts.map(o=>`<option${val===o?' selected':''}>${o}</option>`).join('')}</select>`;
  if(f.t==='textarea')return`<textarea id="f_${f.k}" rows="2">${val||''}</textarea>`;
  return`<input id="f_${f.k}" type="${f.t||'text'}" value="${val!=null?val:''}" ${f.placeholder?`placeholder="${f.placeholder}"`:''}">`;
}
function openForm(key,id=null){
  const schema=SCHEMAS[key];
  const row=id?DATA[key].find(r=>r.id===id):{};
  openModal(`<h3>${id?'Modifier':'Ajouter'} — ${schema.title}</h3>
    <div class="formrow">${schema.fields.map(f=>`<div><label>${f.l}${f.req?' *':''}</label>${fieldInput(f,row[f.k])}</div>`).join('')}</div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" id="saveBtn">Enregistrer</button></div>`);
  document.getElementById('saveBtn').onclick=()=>{
    const obj=id?{...row}:{id:uid()};
    let ok=true,first=null;
    schema.fields.forEach(f=>{
      const el=document.getElementById('f_'+f.k);
      let v=el.value; if(f.t==='number')v=v?Number(v):null;
      obj[f.k]=v; el.classList.remove('invalid');
      if(f.req&&!v){ok=false;el.classList.add('invalid');if(!first)first=el;}
    });
    if(!ok){toast('Remplissez les champs obligatoires (encadrés en rouge)','warn');first&&first.focus();return;}
    // Graphisme : reste = prix - avance
    if(key==='graphisme'){obj.reste=Math.max(0,(Number(obj.prix)||0)-(Number(obj.avance)||0));}
    // Date de création automatique (pour les rapports), même si le formulaire n'a pas de champ date visible
    if(!id&&!obj.date)obj.date=todayISO();
    if(!id)DATA[key].push(obj);
    save();closeModal();toast('Enregistré ✓','ok');render();
    if(key==='services')renderNav();
  };
}
function renderCrud(key){
  const schema=SCHEMAS[key];
  const c=document.getElementById('content');
  // Colonnes affichées avec libellés (fallback pour les colonnes calculées absentes de "fields", ex: "reste")
  const colLabelFallback={reste:'Reste',seuil:'Seuil'};
  const colLabels=schema.cols.map(cl=>schema.fields.find(f=>f.k===cl)||{k:cl,l:colLabelFallback[cl]||(cl.charAt(0).toUpperCase()+cl.slice(1))});
  const isStock=key==='stock';
  const categories=isStock?[...new Set(DATA.stock.map(r=>r.categorie).filter(Boolean))].sort((a,b)=>a.localeCompare(b)):[];
  c.innerHTML=`<div class="toolbar">
    <input type="search" id="search" placeholder="Rechercher...">
    ${isStock?`<select id="catFilter" style="max-width:180px">
      <option value="">Toutes les catégories</option>
      ${categories.map(cat=>`<option value="${cat}">${cat}</option>`).join('')}
    </select>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;padding:0 6px">
      <input type="checkbox" id="lowStockFilter"> Stock bas uniquement
    </label>`:''}
    <button class="btn" id="addBtn">+ Ajouter</button>
    <button class="btn ghost" id="exBtn">Export Excel</button>
  </div>
  <div class="card"><table><thead><tr>${colLabels.map(f=>`<th>${f.l}</th>`).join('')}<th>Actions</th></tr></thead><tbody id="tbody"></tbody></table><div id="emptyMsg"></div></div>`;
  const draw=()=>{
    const filter=document.getElementById('search').value||'';
    let rows=DATA[key];
    if(filter)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(filter.toLowerCase()));
    if(isStock){
      const cat=document.getElementById('catFilter').value;
      if(cat)rows=rows.filter(r=>r.categorie===cat);
      if(document.getElementById('lowStockFilter').checked)rows=rows.filter(r=>Number(r.qte)<=Number(r.seuil));
    }
    document.getElementById('tbody').innerHTML=rows.map(r=>`<tr>
      ${schema.cols.map(cl=>{
        const f=schema.fields.find(x=>x.k===cl);
        let v=r[cl]!=null?r[cl]:'';
        if(f&&f.t==='number'&&v!=='')v=fmt(v);
        if(cl==='etat')v=`<span class="badge ${r[cl]==='Livré'||r[cl]==='En cours'?'ok':r[cl]==='En attente'?'warn':'info'}">${r[cl]||''}</span>`;
        if(cl==='reste')v=Number(r.reste)>0?`<span class="badge warn">${fmt(r.reste)}</span>`:`<span class="badge ok">Soldé</span>`;
        if(cl==='qte')v=`<b>${r[cl]||0}</b>${Number(r[cl])<=Number(r.seuil)?` <span class="badge danger">⚠</span>`:''}`;
        return`<td>${v}</td>`;
      }).join('')}
      <td><button class="btn ghost sm" onclick="openForm('${key}','${r.id}')">Modifier</button> <button class="btn danger sm" onclick="delRow('${key}','${r.id}')">Suppr.</button></td>
    </tr>`).join('');
    document.getElementById('emptyMsg').innerHTML=rows.length?'':'<div class="empty">Aucune donnée pour ce filtre.</div>';
  };
  draw();
  document.getElementById('search').oninput=draw;
  if(isStock){
    document.getElementById('catFilter').onchange=draw;
    document.getElementById('lowStockFilter').onchange=draw;
  }
  document.getElementById('addBtn').onclick=()=>openForm(key);
  document.getElementById('exBtn').onclick=()=>{
    const ws=XLSX.utils.json_to_sheet(DATA[key]);const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,schema.title.slice(0,30));XLSX.writeFile(wb,`${key}.xlsx`);
  };
}

function wireIconGallery(rootId,previewId,hiddenId){
  const root=document.getElementById(rootId);

      document.getElementById(previewId).textContent=btn.dataset.icon;
      root.querySelectorAll('.icon-opt').forEach(b=>{b.style.borderColor='transparent';b.style.background='#fff';});
      btn.style.borderColor='var(--blue)';btn.style.background='#EFF4FF';
    };
  });
}

function parseFieldsInput(str){
  return str.split(',').map(s=>s.trim()).filter(Boolean).map((s,i)=>{
    const parts=s.split(':');
    const label=(parts[0]||'').trim();
    let type=(parts[1]||'text').trim().toLowerCase();
    if(!['text','number','textarea'].includes(type))type='text';
    return {k:'f'+i,l:label,t:type,req:i===0?1:undefined};
  });
}
function ensureCustomData(modId){
  if(!DATA.customData[modId])DATA.customData[modId]=[];

}

    m.fields.forEach(f=>{
      const el=document.getElementById('f_'+f.k);

/* ===== PDF HELPER ===== */
function makePDF(title, lines, subtitle=''){
  const s=DATA.settings;
  const doc=new window._jspdf.jsPDF();
  let y=10;
  // En-tête
  if(s.logo){try{doc.addImage(s.logo,'PNG',14,y,22,22);}catch(e){}}
  const tx=s.logo?42:14;
  doc.setFontSize(15);doc.setFont(undefined,'bold');doc.text(s.nom||'ZAKTECH',tx,y+8);
  doc.setFontSize(8);doc.setFont(undefined,'normal');doc.setTextColor(100);
  [s.adresse,[s.tel,s.email].filter(Boolean).join(' — '),s.site].filter(Boolean).forEach((l,i)=>doc.text(l,tx,y+14+i*5));
  doc.setTextColor(0);y+=34;
  doc.setLineWidth(0.3);doc.line(14,y,196,y);y+=7;
  doc.setFontSize(13);doc.setFont(undefined,'bold');doc.text(title,14,y);
  if(subtitle){doc.setFontSize(9);doc.setFont(undefined,'normal');doc.setTextColor(80);doc.text(subtitle,14,y+6);doc.setTextColor(0);y+=5;}
  y+=10;
  lines.forEach(l=>{
    if(typeof l==='string'&&l==='---'){doc.setLineWidth(0.2);doc.line(14,y,196,y);y+=5;return;}
    if(typeof l==='object'&&l.head){
      doc.setFontSize(8);doc.setFont(undefined,'bold');
      l.head.forEach((h,i)=>doc.text(h,l.x[i],y));y+=5;
      doc.setLineWidth(0.2);doc.line(14,y,196,y);y+=4;
      doc.setFont(undefined,'normal');
      return;
    }
    if(typeof l==='object'&&l.row){
      doc.setFontSize(8);
      l.row.forEach((v,i)=>doc.text(String(v),l.x[i],y));y+=6;
      return;
    }
    doc.setFontSize(9);doc.setFont(undefined,'normal');
    const[key,val]=typeof l==='object'?[l.k,l.v]:[l,''];
    if(val!==undefined&&val!==''){doc.setFont(undefined,'bold');doc.text(key+' :',14,y);doc.setFont(undefined,'normal');doc.text(String(val),80,y);}
    else doc.text(key,14,y);
    y+=6;if(y>275){doc.addPage();y=20;}
  });
  return doc;
}

      const prix=Number(document.getElementById('v_prix').value)||0;
      const client=document.getElementById('v_client').value;
      const mode=document.getElementById('v_mode').value;
      const date=document.getElementById('v_date').value;
      if(!qte||!prix){toast('Indiquez la quantité et le prix','warn');return;}
      if(Number(art.qte)<qte){toast(`Stock insuffisant (disponible : ${art.qte})`, 'warn');return;}
      const total=qte*prix;
      // Déduire du stock
      art.qte=Number(art.qte)-qte;
      const vente={id:uid(),article:art.nom,client,qte,prix,total,mode,date};
      DATA.ventes.push(vente);
      DATA.paiements.push({id:uid(),client,montant:total,mode,date,ref:'VNT-'+Date.now().toString().slice(-6)});
      addCaisse('entree',`Vente ${art.nom}${client?' — '+client:''}`,total,date);
      save();closeModal();toast('Vente enregistrée ✓','ok');draw();
    };
  };
}

  document.getElementById('manageServicesBtn').onclick=openImpServicesModal;

    const {period,customMonth}=currentPeriod('periodFilter');
    const rows=[...DATA.impressions].reverse().filter(x=>
      inPeriod(x.date,period,customMonth) &&

    document.getElementById('emptyMsg').innerHTML=rows.length?'':periodEmptyMsg(period);
  };
  draw();
  document.getElementById('search').oninput=draw;
  wirePeriodFilter('periodFilter',draw);
  document.getElementById('save').onclick=()=>{
    const montant=Number(document.getElementById('montant').value)||0;
    if(!montant){toast('Indiquez un montant','warn');document.getElementById('montant').focus();return;}
    const svc=document.getElementById('svc').value;
    const client=document.getElementById('client').value;
    const pu=document.getElementById('pu').value;
    const pages=document.getElementById('pages').value;
    const rv=document.getElementById('rv').value;
    const fmt2=document.getElementById('format').value;
    const details=`${fmt2}, ${rv}, ${pages} p.${pu?', '+pu+' FCFA/p':''}`;
    const date=todayISO();
    DATA.impressions.push({id:uid(),client,svc,details,montant,date});
    DATA.paiements.push({id:uid(),client,montant,mode:'Espèces',date,ref:'IMP-'+Date.now().toString().slice(-6)});
    addCaisse('entree',svc+(client?' — '+client:''),montant,date);
    save();toast('Enregistré ✓','ok');draw();
    ['montant','client','pu'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('pages').value='1';
    document.getElementById('totalLbl').textContent='—';
  };
}

function renderFactures(){
  const c=document.getElementById('content');
  c.innerHTML=`<div class="toolbar">
    <button class="btn" id="addBtn">+ Nouvelle facture / devis</button>
    <select id="filterSt" style="width:160px"><option value="">Tous statuts</option><option>En instance</option><option>Payée</option></select>
  </div>
  <div class="card"><table><thead><tr><th>N°</th><th>Type</th><th>Client</th><th>Total TTC</th><th>Statut</th><th>Date</th><th>Actions</th></tr></thead><tbody id="tbody"></tbody></table><div id="emptyMsg"></div></div>`;
  const draw=()=>{
    const fl=document.getElementById('filterSt').value;
    let rows=[...DATA.factures].reverse();
    if(fl)rows=rows.filter(f=>(f.statut||'En instance')===fl);
    document.getElementById('tbody').innerHTML=rows.map(f=>{
      const st=f.statut||'En instance';
      return`<tr><td class="mono">${f.numero}</td><td>${f.type}</td><td>${f.client}</td><td>${fmt(f.montant)}</td>
      <td><span class="badge ${st==='Payée'?'ok':'warn'}" style="cursor:pointer" onclick="toggleFactureStatut('${f.id}')" title="Cliquer pour changer">${st}</span></td>
      <td>${f.date}</td>
      <td><button class="btn ghost sm" onclick="printFacture('${f.id}')">PDF</button> <button class="btn danger sm" onclick="delFacture('${f.id}')">Suppr.</button></td></tr>`;
    }).join('');
    document.getElementById('emptyMsg').innerHTML=rows.length?'':'<div class="empty">Aucun document.</div>';
  };
  draw();
  document.getElementById('filterSt').onchange=draw;
  window.toggleFactureStatut=id=>{const f=DATA.factures.find(x=>x.id===id);f.statut=f.statut==='Payée'?'En instance':'Payée';save();draw();toast(`Statut : ${f.statut}`);};
  window.delFacture=id=>{if(confirm('Supprimer ?')){DATA.factures=DATA.factures.filter(f=>f.id!==id);save();draw();}};
  document.getElementById('addBtn').onclick=()=>{
    let lignes=[{desc:'',qte:1,pu:0}];
    const tva=Number(DATA.settings.tva)||0;
    const rl=()=>lignes.map((l,i)=>`<div style="display:grid;grid-template-columns:1fr 60px 110px 30px;gap:6px;margin-bottom:6px" data-row="${i}">
      <input class="ln-desc" list="svcList" placeholder="Désignation" value="${l.desc}">
      <input class="ln-qte" type="number" min="1" value="${l.qte}" title="Quantité">
      <input class="ln-pu" type="number" value="${l.pu}" title="Prix unitaire">
      <button type="button" class="btn danger sm ln-del">✕</button>
    </div>`).join('');
    openModal(`<h3>Nouveau document</h3>
      <datalist id="svcList">${DATA.services.map(s=>`<option value="${s.nom}">`).join('')}</datalist>
      <div class="formrow">
        <div><label>Type</label><select id="f_type">${['Facture','Devis','Reçu','Avoir','Proforma'].map(t=>`<option>${t}</option>`).join('')}</select></div>
        <div><label>Client *</label><input id="f_client" list="cliL2"><datalist id="cliL2">${DATA.clients.map(c=>`<option value="${c.nom} ${c.prenom||''}">`).join('')}</datalist></div>
        <div><label>Date</label><input id="f_date" type="date" value="${todayISO()}"></div>
        <div><label>Statut</label><select id="f_statut"><option>En instance</option><option>Payée</option></select></div>
      </div>
      <label>Lignes (Désignation / Qté / Prix unitaire)</label>
      <div id="lignesBox" style="margin:8px 0">${rl()}</div>
      <button type="button" class="btn ghost sm" id="addLigne">+ Ligne</button>
      <div style="text-align:right;font-size:13px;margin-top:12px;line-height:2">
        Sous-total : <b class="mono" id="st">—</b><br>
        TVA (${tva}%) : <b class="mono" id="tvaAmt">—</b><br>
        <span style="font-size:15px">Total TTC : <b class="mono" style="color:var(--blue)" id="ttc">—</b></span>
      </div>
      <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" id="saveBtn">Enregistrer</button></div>`);
    const box=document.getElementById('lignesBox');
    const recalc=()=>{
      box.querySelectorAll('[data-row]').forEach((row,i)=>{
        lignes[i].desc=row.querySelector('.ln-desc').value;
        lignes[i].qte=Number(row.querySelector('.ln-qte').value)||0;
        lignes[i].pu=Number(row.querySelector('.ln-pu').value)||0;
      });
      const st=lignes.reduce((s,l)=>s+l.qte*l.pu,0);
      const tv=Math.round(st*tva/100);
      document.getElementById('st').textContent=fmt(st);
      document.getElementById('tvaAmt').textContent=fmt(tv);
      document.getElementById('ttc').textContent=fmt(st+tv);
    };
    const wire=()=>{
      box.innerHTML=rl();
      box.querySelectorAll('.ln-desc').forEach(inp=>{
        inp.oninput=()=>{
          const s=DATA.services.find(x=>x.nom===inp.value);
          if(s)inp.closest('[data-row]').querySelector('.ln-pu').value=s.prix;
          recalc();
        };
      });
      box.querySelectorAll('.ln-qte,.ln-pu').forEach(inp=>inp.oninput=recalc);
      box.querySelectorAll('.ln-del').forEach((btn,i)=>btn.onclick=()=>{if(lignes.length>1){lignes.splice(i,1);wire();recalc();}});
      recalc();
    };
    wire();
    document.getElementById('addLigne').onclick=()=>{lignes.push({desc:'',qte:1,pu:0});wire();};
    document.getElementById('saveBtn').onclick=()=>{
      recalc();
      const client=document.getElementById('f_client').value.trim();
      if(!client){toast('Indiquez un client','warn');return;}
      const vl=lignes.filter(l=>l.desc);
      if(!vl.length){toast('Ajoutez au moins une ligne','warn');return;}
      const sousTotal=vl.reduce((s,l)=>s+l.qte*l.pu,0);
      const tv=Math.round(sousTotal*tva/100);
      const type=document.getElementById('f_type').value;
      const statut=document.getElementById('f_statut').value;
      const date=document.getElementById('f_date').value;
      const obj={id:uid(),type,client,date,lignes:vl,sousTotal,tva:tv,montant:sousTotal+tv,statut,numero:type.slice(0,3).toUpperCase()+'-'+Date.now().toString().slice(-6)};
      DATA.factures.push(obj);
      if(statut==='Payée'){
        DATA.paiements.push({id:uid(),client,montant:obj.montant,mode:'Espèces',date,ref:obj.numero});
        addCaisse('entree',`${type} ${obj.numero} — ${client}`,obj.montant,date);
      }
      save();closeModal();toast('Document créé ✓','ok');draw();
    };
  };
  window.printFacture=id=>{
    const f=DATA.factures.find(x=>x.id===id);
    const s=DATA.settings;
    const tva=Number(s.tva)||0;
    const lines=[{k:'N°',v:f.numero},{k:'Client',v:f.client},{k:'Date',v:f.date},{k:'Statut',v:f.statut||'En instance'},'---',
      {head:['Désignation','Qté','Prix unit.','Total'],x:[14,110,135,165]},
      ...(f.lignes||[]).map(l=>({row:[l.desc.slice(0,45),String(l.qte),fmt(l.pu),fmt(l.qte*l.pu)],x:[14,110,135,165]})),
      '---',{k:'Sous-total',v:fmt(f.sousTotal)},{k:`TVA (${tva}%)`,v:fmt(f.tva)},{k:'TOTAL TTC',v:fmt(f.montant)}];
    const doc=makePDF(f.type.toUpperCase(),lines,`N° ${f.numero}`);
    doc.save(`${f.type}_${f.numero}.pdf`);
  };
}

function renderRapports(){
  const c=document.getElementById('content');
  c.innerHTML=`<div class="toolbar">${periodFilterHTML('repPeriod','month')}</div>
  <div class="card" id="caCard" style="margin-bottom:16px"></div>
  <div class="card"><div class="panel-title"><h2>Répartition par activité</h2></div><canvas id="chartRep" height="130"></canvas></div>`;
  let chartInstance=null;
  const draw=()=>{
    const {period,customMonth}=currentPeriod('repPeriod');
    let label='';
    if(period==='today')label="Aujourd'hui";
    else if(period==='week')label='Cette semaine';
    else if(period==='month')label=`Mois en cours — ${monthLabel(todayISO().slice(0,7))}`;
    else if(period==='custom-month')label=customMonth?monthLabel(customMonth):'';
    else if(period==='all')label='Toutes les dates';
    if(period===''||(period==='custom-month'&&!customMonth)){
      document.getElementById('caCard').innerHTML='<div class="empty" style="padding:10px 0">Choisissez une période ci-dessus pour afficher le chiffre d\'affaires.</div>';
      document.getElementById('chartRep').style.display='none';
      if(chartInstance){chartInstance.destroy();chartInstance=null;}
      return;
    }
    document.getElementById('chartRep').style.display='';
    const payTotal=DATA.paiements.filter(p=>inPeriod(p.date,period,customMonth)).reduce((s,p)=>s+Number(p.montant||0),0);
    document.getElementById('caCard').innerHTML=`<div class="panel-title"><h2>CA — ${label}</h2></div><div class="value blue" style="font-size:28px">${fmt(payTotal)}</div>`;
    const byService=[
      {l:'Formations',v:DATA.inscriptions.filter(i=>inPeriod(i.date,period,customMonth)).reduce((s,i)=>s+Number(i.paye||0),0)},
      {l:'Impressions',v:DATA.impressions.filter(x=>inPeriod(x.date,period,customMonth)).reduce((s,i2)=>s+Number(i2.montant||0),0)},
      {l:'Graphisme',v:DATA.graphisme.filter(g=>inPeriod(g.date,period,customMonth)).reduce((s,g)=>s+Number(g.prix||0),0)},
      {l:'Maintenance',v:DATA.maintenance.filter(m=>inPeriod(m.date,period,customMonth)).reduce((s,m)=>s+Number(m.facture||0),0)},
      {l:'Ventes',v:DATA.ventes.filter(v=>inPeriod(v.date,period,customMonth)).reduce((s,v)=>s+Number(v.total||0),0)},
    ];
    if(chartInstance)chartInstance.destroy();
    chartInstance=new Chart(document.getElementById('chartRep'),{type:'doughnut',data:{labels:byService.map(b=>b.l),datasets:[{data:byService.map(b=>b.v),backgroundColor:[(DATA.settings.colors&&DATA.settings.colors.primary)||'#2563EB',(DATA.settings.colors&&DATA.settings.colors.ok)||'#16A34A',(DATA.settings.colors&&DATA.settings.colors.warn)||'#D97706',(DATA.settings.colors&&DATA.settings.colors.danger)||'#DC2626','#7C3AED']}]},options:{plugins:{legend:{position:'bottom'}}}});
  };
  draw();
  wirePeriodFilter('repPeriod',draw);
}

      <div><label>TVA (%)</label><input id="p_tva" type="number" value="${s.tva}"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <input type="checkbox" id="p_dark" ${s.dark?'checked':''} style="width:auto"><label style="margin:0">Mode sombre</label>
    </div>
    <button class="btn" id="saveP">Enregistrer</button>
    <hr style="margin:22px 0;border:none;border-top:1px solid var(--gray-mid)">
    <h3>Apparence</h3>
    <div class="section-hint">Personnalisez les couleurs utilisées dans toute l'application (boutons, menu, graphiques, badges...).</div>
    <div class="formrow">
      <div><label>Couleur principale</label><input type="color" id="col_primary" value="${(s.colors&&s.colors.primary)||'#2563EB'}" style="height:38px;padding:2px"></div>
      <div><label>Couleur succès</label><input type="color" id="col_ok" value="${(s.colors&&s.colors.ok)||'#16A34A'}" style="height:38px;padding:2px"></div>
      <div><label>Couleur danger</label><input type="color" id="col_danger" value="${(s.colors&&s.colors.danger)||'#DC2626'}" style="height:38px;padding:2px"></div>
      <div><label>Couleur avertissement</label><input type="color" id="col_warn" value="${(s.colors&&s.colors.warn)||'#D97706'}" style="height:38px;padding:2px"></div>
    </div>
    <button class="btn" id="saveColors">Appliquer les couleurs</button>
    <button class="btn ghost" id="resetColors" style="margin-left:8px">Réinitialiser</button>
    <hr style="margin:22px 0;border:none;border-top:1px solid var(--gray-mid)">
    <h3>Sécurité</h3>
    <div class="section-hint">${s.secCode?'Un code de sécurité protège actuellement l\'accès à cette page.':'Protégez l\'accès à cette page Paramètres avec un code secret (4 à 8 caractères).'}</div>
    <div class="formrow">
      <div><label>${s.secCode?'Nouveau code':'Code de sécurité'}</label><input id="p_pin" type="password" maxlength="8" placeholder="${s.secCode?'••••':'Ex: 1234'}"></div>
      <div><label>Confirmer le code</label><input id="p_pin2" type="password" maxlength="8"></div>
    </div>
    <button class="btn" id="savePin">${s.secCode?'Changer le code':'Activer la protection'}</button>
    ${s.secCode?`<button class="btn ghost" id="removePin" style="margin-left:8px">Retirer la protection</button>`:''}
    <hr style="margin:22px 0;border:none;border-top:1px solid var(--gray-mid)">
    <h3>Services</h3>
    <div class="section-hint">Ces services pré-remplissent les prix dans les factures et apparaissent dans le menu.</div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <input id="ps_nom" placeholder="Nom du service" style="flex:1;min-width:130px">
      <input id="ps_prix" type="number" placeholder="Prix (FCFA)" style="width:120px">
      <button class="btn" id="ps_add">+ Ajouter</button>
    </div>
    <table id="ps_table"><thead><tr><th>Service</th><th>Prix</th><th></th></tr></thead><tbody id="ps_tbody"></tbody></table>
    <div id="ps_empty"></div>
    <hr style="margin:22px 0;border:none;border-top:1px solid var(--gray-mid)">
    <h3>Modules</h3>
    <div class="section-hint">Tous les modules (système et personnalisés) regroupés par section du menu. Cliquez sur une section pour l'ouvrir et gérer ses modules.</div>
    <div style="margin-bottom:12px"><button class="btn" id="cm_add">+ Nouveau module</button></div>
    <div id="modAccWrap"></div>
    <hr style="margin:22px 0;border:none;border-top:1px solid var(--gray-mid)">
    <h3>Sauvegarde & Restauration</h3>
    <div class="section-hint">Les données ne se synchronisent pas automatiquement entre vos appareils. Téléchargez une sauvegarde depuis un appareil, puis importez-la sur l'autre (par WhatsApp, email ou clé USB) pour avoir les mêmes données partout.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">
      <button class="btn" id="exportAllBtn">📥 Télécharger une sauvegarde complète</button>
      <button class="btn ghost" id="importAllBtn">📤 Importer une sauvegarde</button>
      <input type="file" id="importAllInput" accept=".json" style="display:none">
    </div>
    <hr style="margin:22px 0;border:none;border-top:1px solid var(--gray-mid)">
    <button class="btn danger" id="resetAll">Réinitialiser toutes les données</button>
  </div>`;
  document.getElementById('exportAllBtn').onclick=()=>{
    const backup=JSON.stringify(DATA,null,2);
    const blob=new Blob([backup],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`zaktech-sauvegarde-${todayISO()}.json`;a.click();
    URL.revokeObjectURL(url);
    toast('Sauvegarde téléchargée ✓','ok');
  };
  document.getElementById('importAllBtn').onclick=()=>document.getElementById('importAllInput').click();
  document.getElementById('importAllInput').onchange=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    if(!confirm('Importer cette sauvegarde va REMPLACER toutes les données actuelles sur cet appareil (données actuelles perdues). Continuer ?')){
      e.target.value='';return;
    }
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const imported=JSON.parse(ev.target.result);
        if(!imported||typeof imported!=='object'||!imported.settings){throw new Error('format invalide');}
        DATA=imported;
        save();
        toast('Sauvegarde importée ✓','ok');
        setTimeout(()=>location.reload(),1000);
      }catch(err){
        toast('Fichier de sauvegarde invalide','warn');
      }
    };
    reader.readAsText(file);
    e.target.value='';
  };
  document.getElementById('p_logo').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=()=>{s.logo=r.result;save();updateBrand();renderParametres();toast('Logo mis à jour ✓','ok');};r.readAsDataURL(f);
  };
  const rm=document.getElementById('rmLogo');if(rm)rm.onclick=()=>{s.logo='';save();updateBrand();renderParametres();};
  document.getElementById('saveP').onclick=()=>{
    ['nom','adresse','tel','whatsapp','email','site','devise','tva'].forEach(k=>s[k]=document.getElementById('p_'+k).value);
    s.dark=document.getElementById('p_dark').checked;
    document.body.classList.toggle('dark',s.dark);
    save();updateBrand();toast('Paramètres enregistrés ✓','ok');
  };
  document.getElementById('saveColors').onclick=()=>{
    s.colors={
      primary:document.getElementById('col_primary').value,
      ok:document.getElementById('col_ok').value,
      danger:document.getElementById('col_danger').value,
      warn:document.getElementById('col_warn').value
    };
    applyColors();save();toast('Couleurs appliquées ✓','ok');
  };
  document.getElementById('resetColors').onclick=()=>{
    s.colors={primary:'#2563EB',ok:'#16A34A',danger:'#DC2626',warn:'#D97706'};
    applyColors();save();renderParametres();toast('Couleurs réinitialisées');
  };
  document.getElementById('savePin').onclick=()=>{
    const p1El=document.getElementById('p_pin'),p2El=document.getElementById('p_pin2');
    const p1=p1El.value.trim(),p2=p2El.value.trim();
    p1El.classList.remove('invalid');p2El.classList.remove('invalid');
    if(!p1){p1El.classList.add('invalid');p1El.focus();toast('Indiquez un code','warn');return;}
    if(p1.length<4){p1El.classList.add('invalid');p1El.focus();toast('Le code doit contenir au moins 4 caractères','warn');return;}
    if(p1!==p2){p2El.classList.add('invalid');p2El.focus();toast('Les deux codes ne correspondent pas','warn');return;}
    s.secCode=p1;paramUnlocked=true;
    save();toast('Code de sécurité enregistré ✓','ok');renderParametres();
  };
  const rmPinBtn=document.getElementById('removePin');
  if(rmPinBtn)rmPinBtn.onclick=()=>{
    if(confirm('Retirer la protection par code des paramètres ?')){
      s.secCode='';paramUnlocked=true;save();toast('Protection retirée');renderParametres();
    }
  };
  const drawPS=()=>{
    document.getElementById('ps_tbody').innerHTML=DATA.services.map(sv=>`<tr>
      <td><input value="${sv.nom}" id="psn_${sv.id}" style="border:1px solid var(--gray-mid);border-radius:6px;padding:5px 8px;font-size:13px;width:100%"></td>
      <td><input type="number" value="${sv.prix}" id="psp_${sv.id}" style="border:1px solid var(--gray-mid);border-radius:6px;padding:5px 8px;font-size:13px;width:90px"></td>
      <td style="white-space:nowrap">
        <button class="btn ghost sm" onclick="psSave('${sv.id}')">✓</button>
        <button class="btn danger sm" onclick="psDel('${sv.id}','${sv.nom}')">Suppr.</button>
      </td></tr>`).join('');
    document.getElementById('ps_empty').innerHTML=DATA.services.length?'':'<div style="padding:14px;text-align:center;color:var(--ink-soft);font-size:13px">Aucun service.</div>';
  };
  drawPS();
  document.getElementById('ps_add').onclick=()=>{
    const el=document.getElementById('ps_nom');const nom=el.value.trim();
    el.classList.remove('invalid');if(!nom){el.classList.add('invalid');el.focus();toast('Indiquez un nom','warn');return;}
    DATA.services.push({id:uid(),nom,prix:Number(document.getElementById('ps_prix').value)||0});
    save();el.value='';document.getElementById('ps_prix').value='';drawPS();renderNav();toast('Service ajouté ✓','ok');
  };
  window.psSave=id=>{
    const sv=DATA.services.find(x=>x.id===id);
    const nom=document.getElementById('psn_'+id).value.trim();
    if(!nom){toast('Le nom ne peut pas être vide','warn');return;}
    sv.nom=nom;sv.prix=Number(document.getElementById('psp_'+id).value)||0;
    save();drawPS();renderNav();toast('Modifié ✓','ok');
  };
  window.psDel=(id,nom)=>{
    if(confirm(`Supprimer "${nom}" ?`)){
      DATA.services=DATA.services.filter(s=>s.id!==id);
      if(current==='svc_'+id)current='services';
      save();drawPS();renderNav();toast('Supprimé');
    }
  };
  const drawModulesAcc=()=>{
    const groups=[{id:'ops',label:'Opérations'},{id:'stock',label:'Stock & Achats'},{id:'rh',label:'Ressources Humaines'},{id:'fin',label:'Finance & Admin'}];
    const html=groups.map(g=>{
      const fixedMods=MODULES_FIXES.filter(m=>m.group===g.id);
      const customMods=DATA.modulesPerso.filter(m=>(m.group||'fin')===g.id);
      const total=fixedMods.length+customMods.length;
      const fixedRows=fixedMods.map(m=>{
        const ov=DATA.moduleLabels[m.id]||{};
        const hidden=DATA.hiddenModules.includes(m.id);
        return `<tr style="${hidden?'opacity:.5':''}">
          <td style="font-size:16px">${ov.icon||m.icon}</td>
          <td>${ov.label||m.label} ${hidden?'<span class="badge warn">Masqué</span>':'<span class="badge info">Système</span>'}</td>
          <td style="white-space:nowrap">
            <button class="btn ghost sm" onclick="openFixedModuleEditForm('${m.id}')">Renommer</button>
            ${hidden?`<button class="btn ok sm" onclick="showModule('${m.id}')">Afficher</button>`:`<button class="btn danger sm" onclick="hideModule('${m.id}')">Supprimer</button>`}
          </td></tr>`;
      }).join('');
      const customRows=customMods.map(m=>`<tr>
        <td style="font-size:16px">${m.icon||'📁'}</td>
        <td>${m.label} <span class="badge ok">Personnalisé</span></td>
        <td style="white-space:nowrap">
          <button class="btn ghost sm" onclick="openModuleEditForm('${m.id}')">Renommer</button>
          <button class="btn danger sm" onclick="delModule('${m.id}')">Suppr.</button>
        </td></tr>`).join('');
      const body=total?`<table><thead><tr><th></th><th>Module</th><th></th></tr></thead><tbody>${fixedRows}${customRows}</tbody></table>`:'<div style="padding:10px 4px;color:var(--ink-soft);font-size:13px">Aucun module dans cette section.</div>';
      return `<div class="acc-group">
        <button type="button" class="acc-header" data-grp="${g.id}">
          <span>${g.label} <span class="acc-count">(${total})</span></span>
          <span class="acc-chevron">▾</span>
        </button>
        <div class="acc-body" id="accBody_${g.id}">${body}</div>
      </div>`;
    }).join('');
    document.getElementById('modAccWrap').innerHTML=html;
    document.querySelectorAll('.acc-header').forEach(btn=>{
      btn.onclick=()=>{
        const body=document.getElementById('accBody_'+btn.dataset.grp);
        const open=body.classList.toggle('open');
        btn.classList.toggle('open',open);
      };
    });
  };
  drawModulesAcc();
  document.getElementById('cm_add').onclick=()=>openModuleForm();
  document.getElementById('resetAll').onclick=()=>{if(confirm('Supprimer TOUTES les données ?')){DATA=defaultData();save();render();}};
}

/* ===== INIT ===== */
// Charger jsPDF de façon fiable sans CDN externe (utilise le script déjà chargé)
// Pour les PDF on utilise une copie locale intégrée
(function loadJsPDF(){
  // On tente de charger jsPDF via un script dynamique pour éviter l'erreur "Script error"
  if(typeof window.jspdf==='object'&&window.jspdf.jsPDF){window._jspdf=window.jspdf;return;}
  if(typeof window.jsPDF==='function'){window._jspdf={jsPDF:window.jsPDF};return;}
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  s.onload=()=>{window._jspdf=window.jspdf||{jsPDF:window.jsPDF};};
  s.onerror=()=>{
    console.warn('jsPDF non disponible');
    window._jspdf={jsPDF:function(){
      return{text:()=>{},save:()=>toast('PDF indisponible','warn'),
        addImage:()=>{},setFontSize:()=>{},setFont:()=>{},
        setTextColor:()=>{},line:()=>{},addPage:()=>{},setLineWidth:()=>{}};
    }};
  };
  document.head.appendChild(s);
})();
function startApp(){
  document.getElementById('licenseGate').style.display='none';
  document.getElementById('appRoot').style.display='';
  document.body.classList.toggle('dark',DATA.settings.dark);
  applyColors();
  document.getElementById('hamburgerBtn').onclick=()=>{
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('open');
  };
  document.getElementById('sidebarOverlay').onclick=()=>{
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
  };
  const privacyBtn=document.getElementById('privacyToggle');
  document.body.classList.toggle('privacy-mode',privacyMode);
  privacyBtn.classList.toggle('active',privacyMode);
  privacyBtn.textContent=privacyMode?'🙈':'👁️';
  privacyBtn.onclick=()=>{
    privacyMode=!privacyMode;
    localStorage.setItem('zaktech_privacy',privacyMode?'1':'0');
    document.body.classList.toggle('privacy-mode',privacyMode);
    privacyBtn.classList.toggle('active',privacyMode);
    privacyBtn.textContent=privacyMode?'🙈':'👁️';
    toast(privacyMode?'Montants masqués':'Montants affichés','ok');
  };
  setInterval(()=>{const el=document.getElementById('clock');if(el)el.textContent=new Date().toLocaleString('fr-FR');},1000);
  render();
}
const savedLicense=localStorage.getItem('zaktech_license');
if(savedLicense&&LICENSE_CODES.hasOwnProperty(savedLicense)){
  startApp();
}else{
  document.getElementById('licenseGate').style.display='flex';
  const tryActivate=()=>{
    const el=document.getElementById('licenseInput');
    const val=el.value.trim().toUpperCase();
    el.classList.remove('invalid');
    if(LICENSE_CODES.hasOwnProperty(val)){
      localStorage.setItem('zaktech_license',val);
      startApp();
    }else{
      el.classList.add('invalid');
      toast('Code invalide','warn');
    }
  };
  document.getElementById('licenseBtn').onclick=tryActivate;
  document.getElementById('licenseInput').addEventListener('keydown',e=>{if(e.key==='Enter')tryActivate();});
  document.getElementById('licenseInput').focus();
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
